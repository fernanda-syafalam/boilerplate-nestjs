apiVersion: apps/v1
kind: Deployment
metadata:
  name: boilerplate-nestjs
  labels:
    app.kubernetes.io/name: boilerplate-nestjs
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: boilerplate-nestjs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: boilerplate-nestjs
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: boilerplate-nestjs
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: REPLACE_ME_IMAGE # registry/path:<commit-sha> — never :latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: boilerplate-nestjs-config
            - secretRef:
                name: boilerplate-nestjs-secrets
          # Per-Deployment name so API and worker spans are distinguishable.
          env:
            - name: OTEL_SERVICE_NAME
              value: boilerplate-nestjs-api
          # Distroless has no sleep: delay SIGTERM so endpoints are removed first.
          lifecycle:
            preStop:
              exec:
                command: ["/nodejs/bin/node", "-e", "setTimeout(()=>{},5000)"]
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
