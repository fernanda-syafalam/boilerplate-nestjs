apiVersion: batch/v1
kind: Job
metadata:
  # Job specs are immutable: use a unique name per release (e.g. suffix the commit SHA).
  name: boilerplate-nestjs-migrate
  labels:
    app.kubernetes.io/name: boilerplate-nestjs-migrate
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: boilerplate-nestjs-migrate
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: REPLACE_ME_IMAGE
          imagePullPolicy: IfNotPresent
          command: ["/nodejs/bin/node", "dist/infrastructure/database/migrate.js"]
          envFrom:
            - configMapRef:
                name: boilerplate-nestjs-config
            - secretRef:
                name: boilerplate-nestjs-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
